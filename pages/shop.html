<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shop | Famara'smarket</title>

  <meta
    name="description"
    content="Shop quality products at Famara'smarket."
  >

  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="container header-content">

      <a href="../index.html" class="logo">
        Famara'smarket
      </a>

      <nav class="nav">
        <a href="../index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>

      <button class="cart-button" type="button">
        🛒 Cart <span id="cart-count">0</span>
      </button>

    </div>
  </header>


  <!-- SHOP -->
  <main>

    <section class="page-header">
      <div class="container">
        <h1>Shop Famara'smarket</h1>
        <p>Browse our products and find something you love.</p>
      </div>
    </section>


    <section class="products-section">
      <div class="container">

        <div class="products-grid">

          <!-- PRODUCT 1 -->
          <article class="product-card">
            <div class="product-image">
              🛍️
            </div>

            <div class="product-info">
              <h2>Product Name</h2>
              <p class="product-category">Fashion</p>
              <p class="product-price">Le 0</p>

              <button class="button" type="button">
                Add to Cart
              </button>
            </div>
          </article>


          <!-- PRODUCT 2 -->
          <article class="product-card">
            <div class="product-image">
              💄
            </div>

            <div class="product-info">
              <h2>Product Name</h2>
              <p class="product-category">Beauty</p>
              <p class="product-price">Le 0</p>

              <button class="button" type="button">
                Add to Cart
              </button>
            </div>
          </article>


          <!-- PRODUCT 3 -->
          <article class="product-card">
            <div class="product-image">
              🏠
            </div>

            <div class="product-info">
              <h2>Product Name</h2>
              <p class="product-category">Home</p>
              <p class="product-price">Le 0</p>

              <button class="button" type="button">
                Add to Cart
              </button>
            </div>
          </article>


        </div>

      </div>
    </section>

  </main>


  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">

      <p>
        © 2026 Famara'smarket. All rights reserved.
      </p>

      <p>
        Quality products. Great value. Easy shopping.
      </p>

    </div>
  </footer>


  <script src="../js/script.js"></script>

</body>
</html>
