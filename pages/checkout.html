<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checkout | Famara'smarket</title>

  <meta
    name="description"
    content="Complete your Famara'smarket order."
  >

  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="container header-content">

      <a href="../index.html" class="logo">
        Famara'smarket
      </a>

      <nav class="nav">
        <a href="../index.html">Home</a>
        <a href="shop.html">Shop</a>
      </nav>

    </div>
  </header>


  <!-- CHECKOUT -->
  <main>

    <section class="page-header">
      <div class="container">

        <p class="welcome">FAMARA'SMARKET</p>

        <h1>Checkout</h1>

        <p>
          Complete your details to place your order.
        </p>

      </div>
    </section>


    <section class="checkout-section">
      <div class="container">

        <form id="checkout-form">

          <!-- CUSTOMER DETAILS -->
          <h2>Customer Information</h2>

          <label for="customer-name">
            Full Name
          </label>

          <input
            type="text"
            id="customer-name"
            name="customer-name"
            placeholder="Enter your full name"
            required
          >


          <label for="customer-phone">
            Phone Number
          </label>

          <input
            type="tel"
            id="customer-phone"
            name="customer-phone"
            placeholder="Enter your phone number"
            required
          >


          <label for="customer-address">
            Delivery Address
          </label>

          <textarea
            id="customer-address"
            name="customer-address"
            placeholder="Enter your delivery address"
            rows="4"
            required
          ></textarea>


          <!-- PAYMENT -->
          <h2>Payment Method</h2>

          <label for="payment-method">
            Choose payment method
          </label>

          <select
            id="payment-method"
            name="payment-method"
            required
          >

            <option value="">
              Select payment method
            </option>

            <option value="Orange Money">
              Orange Money
            </option>

            <option value="Afrimoney">
              Afrimoney
            </option>

            <option value="Cash on Delivery">
              Cash on Delivery
            </option>

          </select>


          <!-- ORDER SUMMARY -->
          <h2>Order Summary</h2>

          <div id="checkout-items">
            Your cart is empty.
          </div>

          <p id="checkout-total">
            Total: Le 0
          </p>


          <button
            class="button"
            type="submit"
          >
            Place Order
          </button>

        </form>

      </div>
    </section>

  </main>


  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">

      <p>
        © 2026 Famara'smarket. All rights reserved.
      </p>

      <p>
        Quality products. Great value. Easy shopping.
      </p>

    </div>
  </footer>


  <script src="../js/script.js"></script>

</body>
</html>
